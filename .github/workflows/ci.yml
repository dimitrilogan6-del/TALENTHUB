name: CD - Frontend Angular vers Vercel

on:
  push:
    branches:
      - main
    paths:
      - "TalentHub-Front/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:

  # ============================================================
  # TEST DU FRONTEND
  # ============================================================

  test-frontend:
    name: Tester Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./TalentHub-Front

    steps:

      # ----------------------------------------------------------
      # Récupération du code
      # ----------------------------------------------------------

      - name: Checkout du repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Installation de Node.js
      # ----------------------------------------------------------

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./TalentHub-Front/package-lock.json

      # ----------------------------------------------------------
      # Installation des dépendances
      # ----------------------------------------------------------

      - name: Installer les dépendances
        run: npm ci

      # ----------------------------------------------------------
      # Build Angular
      # ----------------------------------------------------------

      - name: Compiler Angular
        run: npm run build

      # ----------------------------------------------------------
      # Tests Angular / Vitest
      # ----------------------------------------------------------

      - name: Exécuter les tests Angular
        run: npm test -- --watch=false


  # ============================================================
  # DEPLOIEMENT VERCEL
  # ============================================================

  deploy:
    name: Déployer Angular sur Vercel
    runs-on: ubuntu-latest

    needs:
      - test-frontend

    environment:
      name: production

    defaults:
      run:
        working-directory: ./TalentHub-Front

    steps:

      # ----------------------------------------------------------
      # Récupération du code
      # ----------------------------------------------------------

      - name: Checkout du repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Installation de Node.js
      # ----------------------------------------------------------

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ----------------------------------------------------------
      # Installation de Vercel CLI
      # ----------------------------------------------------------

      - name: Installer Vercel CLI
        run: npm install --global vercel@latest

      # ----------------------------------------------------------
      # Récupération de la configuration Vercel
      # ----------------------------------------------------------

      - name: Récupérer la configuration Vercel
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # ----------------------------------------------------------
      # Build Vercel
      # ----------------------------------------------------------

      - name: Construire le projet Vercel
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # ----------------------------------------------------------
      # Déploiement en production
      # ----------------------------------------------------------

      - name: Déployer sur Vercel
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"