name: CD - Frontend Angular vers Vercel

on:
  push:
    branches:
      - main
    paths:
      - "TalentHub-Front/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:

  # ============================================================
  # TEST DU FRONTEND
  # ============================================================

  test-frontend:
    name: Tester Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./TalentHub-Front

    steps:

      - name: Checkout du repository
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./TalentHub-Front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler Angular
        run: npm run build

      - name: Exécuter les tests
        run: npm test -- --watch=false --browsers=ChromeHeadless


  # ============================================================
  # DEPLOIEMENT VERCEL
  # ============================================================

  deploy:
    name: Déployer Angular sur Vercel
    runs-on: ubuntu-latest

    needs:
      - test-frontend

    environment:
      name: production

    defaults:
      run:
        working-directory: ./TalentHub-Front

    steps:

      - name: Checkout du repository
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer Vercel CLI
        run: npm install --global vercel@latest

      - name: Récupérer la configuration Vercel
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construire le projet Vercel
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer sur Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}