name: CD - Backend Django vers Render

on:
  push:
    branches:
      - main
    paths:
      - "TalentHub-backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:

  # ============================================================
  # TEST DJANGO
  # ============================================================

  test-backend:
    name: Tester Django
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./TalentHub-backend

    steps:

      - name: Checkout du repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ./TalentHub-backend/requirements.txt

      - name: Mettre pip à jour
        run: python -m pip install --upgrade pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier Django
        run: python manage.py check

      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Exécuter les tests Django
        run: python manage.py test


  # ============================================================
  # DEPLOIEMENT RENDER
  # ============================================================

  deploy:
    name: Déployer Django sur Render
    runs-on: ubuntu-latest

    needs:
      - test-backend

    environment:
      name: production

    steps:

      - name: Déclencher le déploiement Render
        run: |
          curl -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"