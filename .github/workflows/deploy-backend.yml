name: CI/CD - Backend Django vers Render

on:
  push:
    branches:
      - developpement
      - main
    paths:
      - "TalentHub-backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:

  # ============================================================
  # TEST DJANGO
  # ============================================================

  test-backend:
    name:  Tests Backend Django
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # RÉCUPÉRER LE CODE
      # ----------------------------------------------------------

      - name:  Checkout du repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # VÉRIFIER LA STRUCTURE DU PROJET
      # ----------------------------------------------------------

      - name:  Vérifier les fichiers du projet
        run: |
          echo "Répertoire courant :"
          pwd

          echo ""
          echo "Contenu du dépôt :"
          ls -la

          echo ""
          echo "Contenu de TalentHub-backend :"
          ls -la TalentHub-backend

          echo ""
          echo "Vérification requirements.txt :"
          if [ -f "TalentHub-backend/requirements.txt" ]; then
            echo " requirements.txt trouvé"
          else
            echo " requirements.txt INTROUVABLE"
            exit 1
          fi


      # ----------------------------------------------------------
      # PYTHON
      # ----------------------------------------------------------

      - name:  Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ----------------------------------------------------------
      # DÉPENDANCES
      # ----------------------------------------------------------

      - name:  Mettre pip à jour
        working-directory: ./TalentHub-backend
        run: |
          python -m pip install --upgrade pip


      - name:  Installer les dépendances
        working-directory: ./TalentHub-backend
        run: |
          pip install -r requirements.txt


      # ----------------------------------------------------------
      # VÉRIFICATION DJANGO
      # ----------------------------------------------------------

      - name:  Vérifier Django
        working-directory: ./TalentHub-backend
        run: |
          python manage.py check


      # ----------------------------------------------------------
      # TESTS DJANGO
      # ----------------------------------------------------------

      - name:  Exécuter les tests Django
        working-directory: ./TalentHub-backend
        run: |
          python manage.py test


  # ============================================================
  # DÉPLOIEMENT RENDER
  # ============================================================

  deploy:
    name:  Déploiement sur Render
    runs-on: ubuntu-latest

    needs:
      - test-backend

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name:  Vérifier le Deploy Hook Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo " RENDER_DEPLOY_HOOK_URL est absent."
            exit 1
          fi

          echo " RENDER_DEPLOY_HOOK_URL est configuré."


      - name:  Déclencher le déploiement Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo " Déclenchement du déploiement Render..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo " Déploiement Render déclenché."
