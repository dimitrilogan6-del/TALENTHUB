name: CI/CD - Backend Django vers Render

on:
  push:
    branches:
      - developpement
      - main
    paths:
      - "TalentHub-backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:

  # ============================================================
  # TEST DJANGO
  # ============================================================

  test-backend:
    name:  Tester le backend Django
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./TalentHub-backend

    steps:

      # ----------------------------------------------------------
      # RÉCUPÉRER LE CODE
      # ----------------------------------------------------------

      - name:  Checkout du repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # PYTHON
      # ----------------------------------------------------------

      - name:  Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ./TalentHub-backend/requirements.txt


      # ----------------------------------------------------------
      # DÉPENDANCES
      # ----------------------------------------------------------

      - name:  Mettre pip à jour
        run: python -m pip install --upgrade pip

      - name:  Installer les dépendances
        run: pip install -r requirements.txt


      # ----------------------------------------------------------
      # VÉRIFICATION DJANGO
      # ----------------------------------------------------------

      - name:  Vérifier Django
        run: python manage.py check


      # ----------------------------------------------------------
      # TESTS
      # ----------------------------------------------------------

      - name:  Exécuter les tests Django
        run: python manage.py test


  # ============================================================
  # DÉPLOIEMENT RENDER
  # ============================================================

  deploy:
    name:  Déployer sur Render
    runs-on: ubuntu-latest

    needs:
      - test-backend

    # Déploiement uniquement sur main
    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      # ----------------------------------------------------------
      # VÉRIFIER LE SECRET RENDER
      # ----------------------------------------------------------

      - name:  Vérifier la présence du Deploy Hook Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo " Le secret RENDER_DEPLOY_HOOK_URL est absent."
            exit 1
          fi

          echo " Le secret RENDER_DEPLOY_HOOK_URL est configuré."


      # ----------------------------------------------------------
      # DÉCLENCHER RENDER
      # ----------------------------------------------------------

      - name:  Déclencher le déploiement Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo " Déclenchement du déploiement Render..."

          response=$(curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL")

          echo "Réponse Render :"
          echo "$response"

          echo " Déploiement Render déclenché."
