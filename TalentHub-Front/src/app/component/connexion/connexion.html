<div class="login-page">
  <div class="login-container">
    
    <!-- Colonne Gauche : Image -->
    <div class="login-image">
      <!-- Remplacez par votre image réelle dans assets -->
      <img src="assets/login-team.jpg" alt="Équipe au travail">
    </div>

    <!-- Colonne Droite : Formulaire -->
    <div class="login-form">
      
      <!-- Logo en haut (Optionnel) -->
      <div class="login-logo">
        <span class="logo-blue">Talent</span><span class="logo-green">Hub</span>
      </div>

      <h2 class="form-title">Connexion</h2>
      <p class="form-subtitle">Entrez votre email et mot de passe pour accéder à votre compte</p>

      <!-- Formulaire -->
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" class="form-control" 
                 placeholder="Entrez votre email" 
                 [(ngModel)]="credentials.email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe:</label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" id="password" class="form-control" 
                   placeholder="Entrez votre mot de passe" 
                   [(ngModel)]="credentials.password" name="password" required>
            <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options (Se souvenir de moi / Mot de passe oublié) -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
            <span>Se ouvrir de moi</span>
          </label>
          <a href="#" class="forgot-password">Mot de passe oublié</a>
        </div>

        <!-- Bouton principal -->
        <button type="submit" class="btn-submit" [disabled]="!loginForm.valid">Se connecter</button>

      </form>

      <!-- Boutons sociaux -->
      <div class="social-login">
        <button class="btn-social">
          Se connecter avec Google
          <span class="google-icon">G</span>
        </button>
        <button class="btn-social">
          Se connecter avec LinkedIn
          <span class="linkedin-icon">in</span>
        </button>
      </div>

      <!-- Lien vers l'inscription -->
      <p class="signup-link">
        Pas encore de compte ? <a routerLink="/register" class="signup-link-green">S'inscrire</a>
      </p>

    </div>
  </div>
</div>
