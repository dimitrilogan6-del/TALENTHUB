name: Frontend CI/CD

on:
  push:
    branches:
      - developpement
      - main
    paths:
      - 'TalentHub-Front/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TalentHub-Front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        run: npm run build

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless